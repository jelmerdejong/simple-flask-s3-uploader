[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "simple-flask-s3-uploader"
version = "0.1.0"
description = "A modern Flask app for uploading files to Amazon S3."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "boto3>=1.42.76,<2.0",
  "Flask>=3.1.3,<4.0",
  "Flask-WTF>=1.2.2,<2.0",
  "gunicorn>=25.2.0,<26.0",
  "python-dotenv>=1.2.2,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["s3_uploader"]
